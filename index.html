            --hexagon-height: 121.24px;
            --hexagon-margin-top: 60.62px;
            --hexagon-border-width: 0px;
            --hexagon-color: #2b2f38;
            --hexagon-border-color: #f47721;
            --hexagon-shadow-color: rgba(81,255,0,1);
            --hexagon-shadow-blur: 0px;
            --hexagon-span-color: #f47721;
            --hexagon-span-text-size: 25px;
            --hexagon-span-top: 5.773502691896257px;
            --hexagon-span-width: 280px;
            --hexagon-span-height: 161.6581px;
            
            --hexagon-hover-width: 210px;
            --hexagon-hover-height: 121.24px;
            --hexagon-hover-margin-top: 60.62px;
            --hexagon-hover-border-width: 0px;
            --hexagon-hover-color: #2b2f38;
            --hexagon-hover-border-color: #f47721;
            --hexagon-hover-shadow-color: rgba(81,255,0,1);
            --hexagon-hover-shadow-blur: 0px;
            --hexagon-hover-span-color: #f47721;
            --hexagon-hover-span-text-size: 25px;
            --hexagon-hover-span-top: 5.773502691896257px;
            --hexagon-hover-span-width: 280px;
            --hexagon-hover-span-height: 161.6581px;
            --hexagon-hover-span-transition: 0s;
            --hexagon-hover-transition: 0s;
        }
        .inputContainer {    
            padding: .375rem .75rem;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: .25rem;
        }
        .form-range.inputContainer:has(> .form-range-input:disabled) {
            background-color: var(--bs-bg-2);
            border-color: var(--bs-border-color);
        }
        .form-range.inputContainer:has(> .form-range-input:disabled) > :is(label, .range-value) {
            color: var(--bs-fg-3);
        }
        .range-value {
            float: inline-end;
            inline-size: 6ch;
            box-sizing: content-box;
            padding: 0 .25rem;
            border: 1px solid var(--bs-border-color);
            border-radius: .25rem;
            background-color: transparent;
            color: inherit;
            font: inherit;
            font-variant-numeric: tabular-nums;
            text-align: end;
            appearance: textfield;
        }
        .range-value::-webkit-inner-spin-button,
        .range-value::-webkit-outer-spin-button {
            appearance: none;
            margin: 0;
        }
        .range-value:focus-visible {
            outline: 2px solid var(--bs-fg-2);
            outline-offset: 1px;
        }
        .cursor-picker {
            position: relative;
        }
        .cursor-picker > .combobox-toggle {
            min-height: calc(3.75rem + 2 * var(--bs-border-width));
        }
        .cursor-picker-label {
            display: block;
            color: var(--bs-fg-3);
            font-size: .8125rem;
        }
        .cursor-picker > .menu {
            min-width: 100%;
            --bs-menu-max-height: min(20rem, 50dvh);
        }
        .cursor-picker .menu-item:focus-visible {
            outline: 2px solid var(--bs-fg-2);
            outline-offset: -2px;
        }
        .cursor-picker .menu-item.selected {

        .cursor-picker .menu-item.selected::after {

            margin-inline-start: auto;
        }
        .code-heading {

    <style id="HexagonCodeCSS">
.hexagon {
    cursor: var(--hexagon-cursor);
    position: relative;
    width: var(--hexagon-width);
    height: var(--hexagon-height);
    margin: var(--hexagon-margin-top) auto 0 auto;
    filter: drop-shadow(0 0 calc(var(--hexagon-shadow-blur) / 2) var(--hexagon-shadow-color));
    display: grid;
    pointer-events: none;
    transition: var(--hexagon-hover-transition);
}

.hexagon::before, .hexagon::after {
    content: "";
    position: absolute;
    clip-path: var(--hexagon-outline);
    transition: inset var(--hexagon-hover-transition),
                background-color var(--hexagon-hover-transition),
                opacity var(--hexagon-hover-transition);
}

.hexagon::before {
    inset: calc(-1 * var(--hexagon-margin-top)) 0;
    pointer-events: auto;
    background-color: var(--hexagon-border-color);
    opacity: sign(var(--hexagon-border-width));
}

.hexagon::after {
    inset: calc(var(--hexagon-border-width) * var(--hexagon-border-scale-y) - var(--hexagon-margin-top))
           calc(var(--hexagon-border-width) * var(--hexagon-border-scale-x));
    background: var(--hexagon-background-image) center / cover no-repeat var(--hexagon-color);
}

.hexagon span {
    display: flex;
    justify-content: center;
    align-items: center;
    align-self: start;
    justify-self: center;
    font-size: var(--hexagon-span-text-size);
    color: var(--hexagon-span-color);
    margin-top: var(--hexagon-span-top);
    width: var(--hexagon-span-width);
    height: var(--hexagon-span-height);
    z-index: 1;
    pointer-events: auto;
    transition: var(--hexagon-hover-span-transition);
}
    </style>
    <style id="HexagonHoverCodeCSS">
.hexagon:hover {
    width: var(--hexagon-hover-width);
    height: var(--hexagon-hover-height);
    margin: var(--hexagon-hover-margin-top) auto 0 auto;
    filter: drop-shadow(0 0 calc(var(--hexagon-hover-shadow-blur) / 2) var(--hexagon-hover-shadow-color));
}

.hexagon:hover::before, .hexagon:hover::after {
    clip-path: var(--hexagon-hover-outline);
}

.hexagon:hover::before {
    inset: calc(-1 * var(--hexagon-hover-margin-top)) 0;
    background-color: var(--hexagon-hover-border-color);
    opacity: sign(var(--hexagon-hover-border-width));
}

.hexagon:hover::after {
    inset: calc(var(--hexagon-hover-border-width) * var(--hexagon-hover-border-scale-y) - var(--hexagon-hover-margin-top))
           calc(var(--hexagon-hover-border-width) * var(--hexagon-hover-border-scale-x));
    background-color: var(--hexagon-hover-color);
    background-image: var(--hexagon-hover-background-image);
}

.hexagon span::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: calc(-1 * var(--hexagon-margin-top));
    left: calc((100% - var(--hexagon-width)) / 2);
    width: var(--hexagon-width);
    height: calc(var(--hexagon-height) + 2 * var(--hexagon-margin-top));
    clip-path: var(--hexagon-outline);
    transition: top var(--hexagon-hover-transition);
}

.hexagon:hover span::before {
    top: calc(-1 * var(--hexagon-hover-margin-top));
}

.hexagon:hover span {
    font-size: var(--hexagon-hover-span-text-size);
    color: var(--hexagon-hover-span-color);
    margin-top: var(--hexagon-hover-span-top);
    width: var(--hexagon-hover-span-width);
    height: var(--hexagon-hover-span-height);
}
    </style>

                    <div class="row row-cols-1 sm:row-cols-2 md:row-cols-3 xl:row-cols-5 gy-3">

                            <div class="form-range inputContainer">

                            <div class="form-floating">
                                <label for="hexagonHoverImageURL">Image URL</label>
                                <input class="form-control" id="hexagonHoverImageURL" type="url" placeholder="https://…" oninput="HexagonSizeChange();">
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-range inputContainer">
                                <label for="hexagonHoverBorderSize">Border Size (px)</label>
                                <input class="range-value" type="number" inputmode="decimal" aria-label="Exact Border Size (px)" value="10">
                                <input class="form-range-input" type="range" id="hexagonHoverBorderSize" min="0" max="150" step="1" value="10" oninput="HexagonSizeChange();">
                            </div>
                            <div class="form-floating">
                                <label for="hexagonHoverBorderColor">Border Color</label>
                                <input type="color" class="form-control" id="hexagonHoverBorderColor" placeholder="Border Color" oninput="HexagonSizeChange();" value="#f47721">
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-range inputContainer">
                                <label for="hexagonHoverShadowBlur">Shadow Blur (px)</label>
                                <input class="range-value" type="number" inputmode="decimal" aria-label="Exact Shadow Blur (px)" value="50">
                                <input class="form-range-input" type="range" id="hexagonHoverShadowBlur" min="0" max="200" step="1" value="50" oninput="HexagonSizeChange();">
                            </div>
                            <div class="form-floating">
                                <label for="hexagonHoverShadowColor">Shadow Color</label>
                                <input type="color" class="form-control" id="hexagonHoverShadowColor" placeholder="Shadow Color" oninput="HexagonSizeChange();" value="#00FFFF">
                            </div>
                            <div class="form-range inputContainer">
                                <label for="hexagonHoverShadowColorAlpha">Shadow Alpha</label>
                                <input class="range-value" type="number" inputmode="decimal" aria-label="Exact Shadow Alpha" value="1">
                                <input class="form-range-input" type="range" id="hexagonHoverShadowColorAlpha" oninput="HexagonSizeChange();" min="0" max="1" step="0.01" value="1">
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-floating">
                                <label for="hexagonHoverTextColor">Text Color</label>
                                <input type="color" class="form-control" id="hexagonHoverTextColor" placeholder="Text Color" oninput="HexagonSizeChange();" value="#f47721">
                            </div>
                            <div class="form-range inputContainer">
                                <label for="hexagonHoverTextSize">Text Size (px)</label>
                                <input class="range-value" type="number" inputmode="decimal" aria-label="Exact Text Size (px)" value="25">
                                <input class="form-range-input" type="range" id="hexagonHoverTextSize" min="0" max="150" step="1" value="25" oninput="HexagonSizeChange();">
                            </div>
                            <div class="form-range inputContainer">
                                <label for="hexagonHoverTextTransition">Transition (s)</label>
                                <input class="range-value" type="number" inputmode="decimal" aria-label="Exact Text Transition (s)" value="0">
                                <input class="form-range-input" type="range" id="hexagonHoverTextTransition" min="0" max="5" step="0.1" value="0" oninput="HexagonSizeChange();">
                            </div>
                        </div>

        </section>
        <hr>
        <section class="row row-cols-1 md:row-cols-2 gy-3 mb-3" id="layHexagon">
            <div class="col">
                <div class="hexagon">
                    <span id="layHexagonText"></span>
                </div>
            </div>
            <div class="col">
                <div class="code-panel">
                    <div class="code-heading">
                        <b>HTML:</b>
                        <div class="copy-action">
                            <span role="status"></span>
                            <button class="btn btn-sm btn-outline theme-secondary" type="button" command="--copy-code" commandfor="layHexagonCodeHTML">Copy HTML</button>
                        </div>
                    </div>
                    <pre><code class="language-html" id="layHexagonCodeHTML">...</code></pre>
                </div>
                <div class="code-panel">
                    <div class="code-heading">
                        <b>CSS:</b>
                        <div class="copy-action">
                            <span role="status"></span>
                            <button class="btn btn-sm btn-outline theme-secondary" type="button" command="--copy-code" commandfor="layHexagonCodeCSS">Copy CSS</button>
                        </div>
                    </div>
                    <pre><code class="language-css" id="layHexagonCodeCSS">...</code></pre>
                </div>
            </div>
        </section>
    </section>

    <script>
        function readSetting(input) {
            return input.type === "checkbox" ? (input.checked ? "1" : "0") : input.value;
        }

        function restoreDesign(params) {
            for (const prefix of ["hexagon", "hexagonHover"]) {
                const sizeSlider = document.getElementById(prefix + "Size");
                document.getElementById(prefix + "BorderSize").max = Math.floor(sizeSlider.max / 2);
            }
            for (const { input, key, defaultValue } of designSettings) {
                const value = params.get(key) ?? defaultValue;
                switch (input.type) {
                    case "checkbox":
                        input.checked = (value === "1" || value === "0" ? value : defaultValue) === "1";
                        break;
                    case "range": {
                        const number = Number(value);
                        input.valueAsNumber = value.trim() && Number.isFinite(number) ? number : Number(defaultValue);
                        break;
                    }
                    case "color":
                        input.value = /^#[\da-f]{6}$/i.test(value) ? value : defaultValue;
                        break;
                    default:
                        input.value = value;
                }
            }
            const requestedCursor = params.get("cursor") ?? defaultCursor;
            const option = Array.from(cursorOptions.querySelectorAll("[data-bs-value]"))
                .find(item => item.dataset.bsValue === requestedCursor);
            if (option) {
                const selected = cursorOptions.querySelector(".selected");
                selected.classList.remove("selected");
                selected.setAttribute("aria-selected", "false");
                option.classList.add("selected");
                option.setAttribute("aria-selected", "true");
                document.getElementById("hexagonCursorValue").textContent = requestedCursor;
            }
        }

        function syncDesignURL() {
            clearTimeout(shareURLTimer);
            const url = new URL(location.href);
            for (const { input, key, defaultValue } of designSettings) {
                const value = readSetting(input);
                if (value === defaultValue) url.searchParams.delete(key);
                else url.searchParams.set(key, value);
            }
            const cursor = cursorOptions.querySelector(".selected").dataset.bsValue;
            if (cursor === defaultCursor) url.searchParams.delete("cursor");
            else url.searchParams.set("cursor", cursor);
            if (url.href !== location.href) history.replaceState(history.state, "", url);
            return url.href;
        }

        async function copyText(button, value, failureMessage, status = button.previousElementSibling) {
            const previous = copyFeedback.get(button);
            clearTimeout(previous?.timer);
            const feedback = {};
            copyFeedback.set(button, feedback);
            status.textContent = "";
            let message = "Copied";
            try {
                await navigator.clipboard.writeText(value);
            } catch {
                message = failureMessage;
            }
            if (copyFeedback.get(button) !== feedback) return;
            feedback.message = message === previous?.message ? message + "\u00a0" : message;
            status.textContent = feedback.message;
            feedback.timer = setTimeout(() => status.textContent = "", 3000);
        }

        function getImageURL(inputId) {
            const url = URL.parse(document.getElementById(inputId).value.trim());
            return url && ["http:", "https:"].includes(url.protocol) ? url.href : "";
        }

        function getBackgroundImage(inputId) {
            const url = getImageURL(inputId);
            return url ? `url(${JSON.stringify(url)})` : "none";
        }

        function getBorderSize(inputId, size) {
            const slider = document.getElementById(inputId);
            const max = String(Math.floor(size / 2));
            if (slider.max !== max) {
                slider.max = max;
                slider.dispatchEvent(new Event("change", { bubbles: true }));
            }
            return slider.value;
        }

        function HexagonSizeChange(){
            function ColorHexToRGB(Hex){
                if (Hex[0] == "#") Hex = Hex.slice(1);
                if (Hex.length != 6) throw "Only six-digit hex colors are allowed.";
                const ArrayHex = Hex.match(/.{1,2}/g);
                const ArrayRGB = [
                    parseInt(ArrayHex[0], 16),
                    parseInt(ArrayHex[1], 16),
                    parseInt(ArrayHex[2], 16)
                ];
                return ArrayRGB;
            }
            const HexagonHover = document.getElementById("hexagonHover").checked; 
            document.querySelectorAll("#hover .form-control, #hover .form-range-input, #hexagonHoverFlatTop").forEach((element) => {
                element.disabled = !HexagonHover;
            });
            const sqrt3 = Math.sqrt(3);
            function getOrientation(flatTop) {
                const angledBorderScale = 2 / sqrt3;
                return {
                    flatTop,
                    outline: flatTop
                        ? "polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)"
                        : "polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)",
                    borderScaleX: flatTop ? angledBorderScale : 1,
                    borderScaleY: flatTop ? 1 : angledBorderScale,
                };
            }

            function getGeometry(size, border, { flatTop, borderScaleX, borderScaleY }) {
                const width = flatTop ? size * 2 / sqrt3 : size;
                const height = flatTop ? size : size / sqrt3;
                const innerWidth = width - 2 * border * borderScaleX;
                const textHeight = flatTop ? (height - 2 * border) / 2 : height - border * borderScaleY;
                return {
                    width,
                    height,
                    marginTop: flatTop ? 0 : height / 2,
                    textTop: (height - textHeight) / 2,
                    textWidth: flatTop ? innerWidth * 0.75 : innerWidth,
                    textHeight: textHeight.toFixed(4),
                };
            }

            const orientation = getOrientation(document.getElementById("hexagonFlatTop").checked);
            const hoverOrientation = HexagonHover ? getOrientation(document.getElementById("hexagonHoverFlatTop").checked) : orientation;
            document.documentElement.style.setProperty("--hexagon-outline", orientation.outline);
            document.documentElement.style.setProperty("--hexagon-border-scale-x", orientation.borderScaleX);
            document.documentElement.style.setProperty("--hexagon-border-scale-y", orientation.borderScaleY);
            document.documentElement.style.setProperty("--hexagon-hover-outline", hoverOrientation.outline);
            document.documentElement.style.setProperty("--hexagon-hover-border-scale-x", hoverOrientation.borderScaleX);
            document.documentElement.style.setProperty("--hexagon-hover-border-scale-y", hoverOrientation.borderScaleY);
            const backgroundImage = getBackgroundImage("hexagonImageURL");
            const hoverBackgroundImage = HexagonHover ? getBackgroundImage("hexagonHoverImageURL") : backgroundImage;

            document.documentElement.style.setProperty("--hexagon-background-image", backgroundImage);
            document.documentElement.style.setProperty("--hexagon-hover-background-image", hoverBackgroundImage);

            /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            // General
            /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            const HexagonCursor = cursorOptions.querySelector(".selected").dataset.bsValue;
            const HexagonColor = document.getElementById("hexagonColor").value; 
            const HexagonSize = document.getElementById("hexagonSize").valueAsNumber;
            const HexagonBorderSize = getBorderSize("hexagonBorderSize", HexagonSize);
            const HexagonBorderColor = document.getElementById("hexagonBorderColor").value;
            const HexagonShadowBlur = document.getElementById("hexagonShadowBlur").value;
            const HexagonShadowColor = document.getElementById("hexagonShadowColor").value;
            const HexagonShadowColorArrayRGB = ColorHexToRGB(HexagonShadowColor);
            const HexagonShadowColorAlpha = document.getElementById("hexagonShadowColorAlpha").value;
            const HexagonSpanText = document.getElementById("hexagonText").value;
            const HexagonSpanTextSize = document.getElementById("hexagonTextSize").value;
            const HexagonSpanColor = document.getElementById("hexagonTextColor").value;
            const {
                width: HexagonWidth,
                height: HexagonHeight,
                marginTop: HexagonMarginTop,
                textTop: HexagonShadowSpanTop,
                textWidth: HexagonShadowSpanWidth,
                textHeight: HexagonShadowSpanHeight,
            } = getGeometry(HexagonSize, HexagonBorderSize, orientation);
            const HexagonVariablesCSS = document.getElementById("hexagonVariablesCSS").checked;
            document.documentElement.style.setProperty("--hexagon-cursor", `${HexagonCursor}`);
            document.documentElement.style.setProperty("--hexagon-width", `${HexagonWidth}px`);
            document.documentElement.style.setProperty("--hexagon-height", `${HexagonHeight}px`);
            document.documentElement.style.setProperty("--hexagon-margin-top", `${HexagonMarginTop}px`);
            document.documentElement.style.setProperty("--hexagon-color", `${HexagonColor}`);
            document.documentElement.style.setProperty("--hexagon-border-color", `${HexagonBorderColor}`);
            document.documentElement.style.setProperty("--hexagon-border-width", `${HexagonBorderSize}px`);
            document.documentElement.style.setProperty("--hexagon-shadow-blur", `${HexagonShadowBlur}px`);
            document.documentElement.style.setProperty("--hexagon-shadow-color", `rgba(${HexagonShadowColorArrayRGB[0]},${HexagonShadowColorArrayRGB[1]},${HexagonShadowColorArrayRGB[2]},${HexagonShadowColorAlpha})`);
            document.getElementById("layHexagonText").textContent = HexagonSpanText;
            document.documentElement.style.setProperty("--hexagon-span-text-size", `${HexagonSpanTextSize}px`);
            document.documentElement.style.setProperty("--hexagon-span-color", `${HexagonSpanColor}`);
            document.documentElement.style.setProperty("--hexagon-span-top", `${HexagonShadowSpanTop}px`);
            document.documentElement.style.setProperty("--hexagon-span-width", `${HexagonShadowSpanWidth}px`);
            document.documentElement.style.setProperty("--hexagon-span-height", `${HexagonShadowSpanHeight}px`);
            /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

            /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            // Hover
            /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            const HexagonHoverColor = document.getElementById("hexagonHoverColor").value; 
            const HexagonHoverSize = document.getElementById("hexagonHoverSize").valueAsNumber;
            const HexagonHoverBorderSize = getBorderSize("hexagonHoverBorderSize", HexagonHoverSize);
            const HexagonHoverBorderColor = document.getElementById("hexagonHoverBorderColor").value;
            const HexagonHoverShadowBlur = document.getElementById("hexagonHoverShadowBlur").value;
            const HexagonHoverShadowColor = document.getElementById("hexagonHoverShadowColor").value;
            const HexagonHoverShadowColorArrayRGB = ColorHexToRGB(HexagonHoverShadowColor);
            const HexagonHoverShadowColorAlpha = document.getElementById("hexagonHoverShadowColorAlpha").value;
            const HexagonHoverSpanTextSize = document.getElementById("hexagonHoverTextSize").value;
            const HexagonHoverSpanColor = document.getElementById("hexagonHoverTextColor").value;
            const {
                width: HexagonHoverWidth,
                height: HexagonHoverHeight,
                marginTop: HexagonHoverMarginTop,
                textTop: HexagonHoverShadowSpanTop,
                textWidth: HexagonHoverShadowSpanWidth,
                textHeight: HexagonHoverShadowSpanHeight,
            } = getGeometry(HexagonHoverSize, HexagonHoverBorderSize, hoverOrientation);
            const HexagonHoverTransition = document.getElementById("hexagonHoverTransition").value;
            const HexagonHoverSpanTransition = document.getElementById("hexagonHoverTextTransition").value;
            if (HexagonHover) {
                document.documentElement.style.setProperty("--hexagon-hover-width", `${HexagonHoverWidth}px`);
                document.documentElement.style.setProperty("--hexagon-hover-height", `${HexagonHoverHeight}px`);
                document.documentElement.style.setProperty("--hexagon-hover-margin-top", `${HexagonHoverMarginTop}px`);
                document.documentElement.style.setProperty("--hexagon-hover-color", `${HexagonHoverColor}`);
                document.documentElement.style.setProperty("--hexagon-hover-border-color", `${HexagonHoverBorderColor}`);
                document.documentElement.style.setProperty("--hexagon-hover-border-width", `${HexagonHoverBorderSize}px`);
                document.documentElement.style.setProperty("--hexagon-hover-shadow-blur", `${HexagonHoverShadowBlur}px`);
                document.documentElement.style.setProperty("--hexagon-hover-shadow-color", `rgba(${HexagonHoverShadowColorArrayRGB[0]},${HexagonHoverShadowColorArrayRGB[1]},${HexagonHoverShadowColorArrayRGB[2]},${HexagonHoverShadowColorAlpha})`);
                document.documentElement.style.setProperty("--hexagon-hover-span-text-size", `${HexagonHoverSpanTextSize}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-color", `${HexagonHoverSpanColor}`);
                document.documentElement.style.setProperty("--hexagon-hover-span-top", `${HexagonHoverShadowSpanTop}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-width", `${HexagonHoverShadowSpanWidth}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-height", `${HexagonHoverShadowSpanHeight}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-transition", `${HexagonHoverSpanTransition}s`);
                document.documentElement.style.setProperty("--hexagon-hover-transition", `${HexagonHoverTransition}s`);
            } else {
                document.documentElement.style.setProperty("--hexagon-hover-width", `${HexagonWidth}px`);
                document.documentElement.style.setProperty("--hexagon-hover-height", `${HexagonHeight}px`);
                document.documentElement.style.setProperty("--hexagon-hover-margin-top", `${HexagonMarginTop}px`);
                document.documentElement.style.setProperty("--hexagon-hover-color", `${HexagonColor}`);
                document.documentElement.style.setProperty("--hexagon-hover-border-color", `${HexagonBorderColor}`);
                document.documentElement.style.setProperty("--hexagon-hover-border-width", `${HexagonBorderSize}px`);
                document.documentElement.style.setProperty("--hexagon-hover-shadow-blur", `${HexagonShadowBlur}px`);
                document.documentElement.style.setProperty("--hexagon-hover-shadow-color", `rgba(${HexagonShadowColorArrayRGB[0]},${HexagonShadowColorArrayRGB[1]},${HexagonShadowColorArrayRGB[2]},${HexagonShadowColorAlpha})`);
                document.documentElement.style.setProperty("--hexagon-hover-span-text-size", `${HexagonSpanTextSize}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-color", `${HexagonSpanColor}`);
                document.documentElement.style.setProperty("--hexagon-hover-span-top", `${HexagonShadowSpanTop}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-width", `${HexagonShadowSpanWidth}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-height", `${HexagonShadowSpanHeight}px`);
                document.documentElement.style.setProperty("--hexagon-hover-span-transition", `0s`);
                document.documentElement.style.setProperty("--hexagon-hover-transition", `0s`);
            }
            /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
            
            let hexagonRules = document.getElementById("HexagonCodeCSS").textContent.trim();
            if (HexagonHover) {
                hexagonRules += "\n\n" + document.getElementById("HexagonHoverCodeCSS").textContent.trim();
            }

            const layHexagonCodeCSS = document.getElementById("layHexagonCodeCSS");
            if (HexagonVariablesCSS){
                layHexagonCodeCSS.textContent =
`:root {
    --hexagon-outline: ${orientation.outline};
    --hexagon-border-scale-x: ${orientation.borderScaleX};
    --hexagon-border-scale-y: ${orientation.borderScaleY};
    --hexagon-cursor: ${HexagonCursor};
    --hexagon-width: ${HexagonWidth}px;
    --hexagon-height: ${HexagonHeight}px;
    --hexagon-margin-top: ${HexagonMarginTop}px;
    --hexagon-border-width: ${HexagonBorderSize}px;
    --hexagon-color: ${HexagonColor};
    --hexagon-border-color: ${HexagonBorderColor};
    --hexagon-shadow-color: rgba(${HexagonShadowColorArrayRGB[0]},${HexagonShadowColorArrayRGB[1]},${HexagonShadowColorArrayRGB[2]},${HexagonShadowColorAlpha});
    --hexagon-shadow-blur: ${HexagonShadowBlur}px;
    --hexagon-span-color: ${HexagonSpanColor};
    --hexagon-span-text-size: ${HexagonSpanTextSize}px;
    --hexagon-span-top: ${HexagonShadowSpanTop}px;
    --hexagon-span-width: ${HexagonShadowSpanWidth}px;
    --hexagon-span-height: ${HexagonShadowSpanHeight}px;
    --hexagon-hover-span-transition: ${HexagonHover ? HexagonHoverSpanTransition : 0}s;
    --hexagon-hover-transition: ${HexagonHover ? HexagonHoverTransition : 0}s;
    --hexagon-background-image: ${backgroundImage};
`;
                if (HexagonHover) {
                    layHexagonCodeCSS.textContent +=
`    --hexagon-hover-outline: ${hoverOrientation.outline};
    --hexagon-hover-border-scale-x: ${hoverOrientation.borderScaleX};
    --hexagon-hover-border-scale-y: ${hoverOrientation.borderScaleY};
    --hexagon-hover-background-image: ${hoverBackgroundImage};
    --hexagon-hover-width: ${HexagonHoverWidth}px;
    --hexagon-hover-height: ${HexagonHoverHeight}px;
    --hexagon-hover-margin-top: ${HexagonHoverMarginTop}px;
    --hexagon-hover-border-width: ${HexagonHoverBorderSize}px;
    --hexagon-hover-color: ${HexagonHoverColor};
    --hexagon-hover-border-color: ${HexagonHoverBorderColor};
    --hexagon-hover-shadow-color: rgba(${HexagonHoverShadowColorArrayRGB[0]},${HexagonHoverShadowColorArrayRGB[1]},${HexagonHoverShadowColorArrayRGB[2]},${HexagonHoverShadowColorAlpha});
    --hexagon-hover-shadow-blur: ${HexagonHoverShadowBlur}px;
    --hexagon-hover-span-color: ${HexagonHoverSpanColor};
    --hexagon-hover-span-text-size: ${HexagonHoverSpanTextSize}px;
    --hexagon-hover-span-top: ${HexagonHoverShadowSpanTop}px;
    --hexagon-hover-span-width: ${HexagonHoverShadowSpanWidth}px;
    --hexagon-hover-span-height: ${HexagonHoverShadowSpanHeight}px;
`;
                }
                layHexagonCodeCSS.textContent += `}\n\n${hexagonRules}`;
            } else {
                let HexagonCodeCSS = hexagonRules
                    .replaceAll("var(--hexagon-outline)", orientation.outline)
                    .replaceAll("var(--hexagon-border-scale-x)", orientation.borderScaleX)
                    .replaceAll("var(--hexagon-border-scale-y)", orientation.borderScaleY)
                    .replaceAll("var(--hexagon-hover-outline)", hoverOrientation.outline)
                    .replaceAll("var(--hexagon-hover-border-scale-x)", hoverOrientation.borderScaleX)
                    .replaceAll("var(--hexagon-hover-border-scale-y)", hoverOrientation.borderScaleY);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-cursor)",`${HexagonCursor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-width)",`${HexagonWidth}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-height)",`${HexagonHeight}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-margin-top)",`${HexagonMarginTop}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-border-width)",`${HexagonBorderSize}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-color)",`${HexagonColor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-border-color)",`${HexagonBorderColor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-shadow-color)",`rgba(${HexagonShadowColorArrayRGB[0]},${HexagonShadowColorArrayRGB[1]},${HexagonShadowColorArrayRGB[2]},${HexagonShadowColorAlpha})`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-shadow-blur)",`${HexagonShadowBlur}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-span-color)",`${HexagonSpanColor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-span-text-size)",`${HexagonSpanTextSize}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-span-top)",`${HexagonShadowSpanTop}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-span-width)",`${HexagonShadowSpanWidth}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-span-height)",`${HexagonShadowSpanHeight}px`);     

                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-width)",`${HexagonHoverWidth}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-height)",`${HexagonHoverHeight}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-margin-top)",`${HexagonHoverMarginTop}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-border-width)",`${HexagonHoverBorderSize}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-color)",`${HexagonHoverColor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-border-color)",`${HexagonHoverBorderColor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-shadow-color)",`rgba(${HexagonHoverShadowColorArrayRGB[0]},${HexagonHoverShadowColorArrayRGB[1]},${HexagonHoverShadowColorArrayRGB[2]},${HexagonHoverShadowColorAlpha})`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-shadow-blur)",`${HexagonHoverShadowBlur}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-span-color)",`${HexagonHoverSpanColor}`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-span-text-size)",`${HexagonHoverSpanTextSize}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-span-top)",`${HexagonHoverShadowSpanTop}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-span-width)",`${HexagonHoverShadowSpanWidth}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-span-height)",`${HexagonHoverShadowSpanHeight}px`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-span-transition)", `${HexagonHover ? HexagonHoverSpanTransition : 0}s`);
                HexagonCodeCSS = HexagonCodeCSS.replaceAll("var(--hexagon-hover-transition)", `${HexagonHover ? HexagonHoverTransition : 0}s`);
                layHexagonCodeCSS.textContent = HexagonCodeCSS.replace(/var\(--hexagon-(hover-)?background-image\)/g,
                    (_, hover) => hover ? hoverBackgroundImage : backgroundImage);
            }
            const escapedText = HexagonSpanText.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
            const layHexagonCodeHTML = document.getElementById("layHexagonCodeHTML");
            layHexagonCodeHTML.textContent =
`<div class="hexagon">
    <span>${escapedText}</span>
</div>`;

            for (const { editor, slider } of rangeEditors) {
                editor.max = slider.max;
                editor.value = slider.value;
                editor.disabled = slider.disabled;
            }
            for (const codeBlock of [layHexagonCodeHTML, layHexagonCodeCSS]) {
                // The generated text replaced the previous highlighting.
                delete codeBlock.dataset.highlighted;
                window.hljs?.highlightElement(codeBlock);
            }
            clearTimeout(shareURLTimer);
            shareURLTimer = setTimeout(syncDesignURL, 300);
        }
        const rangeEditors = Array.from(document.querySelectorAll(".range-value"), editor => ({
            editor,
            slider: editor.nextElementSibling,
        }));
        for (const { editor, slider } of rangeEditors) {
            editor.min = slider.min;
            editor.step = slider.step;
            editor.addEventListener("focus", () => editor.select());
            const commitValue = () => {
                const previous = slider.value;
                if (Number.isFinite(editor.valueAsNumber)) slider.valueAsNumber = editor.valueAsNumber;
                editor.value = slider.value;
                if (slider.value !== previous) {
                    slider.dispatchEvent(new Event("input", { bubbles: true }));
                }
            };
            editor.addEventListener("change", commitValue);
            editor.addEventListener("keydown", event => {
                if (event.isComposing) return;
                if (event.key === "Escape") editor.value = slider.value;
                else if (event.key === "Enter") commitValue();
                else return;
                event.preventDefault();
                editor.select();
            });
        }
        const cursorPicker = document.getElementById("hexagonCursor");
        const cursorOptions = document.getElementById("hexagonCursorOptions");
        const defaultCursor = cursorOptions.querySelector(".selected").dataset.bsValue;
        const designSettings = Array.from(document.querySelectorAll("#myTabContent input[id]"), input => {
            const name = input.id.slice("hexagon".length);
            let defaultValue = input.defaultValue;
            if (input.type === "checkbox") defaultValue = input.defaultChecked ? "1" : "0";
            if (input.type === "color") defaultValue = defaultValue.toLowerCase();
            return { input, key: name[0].toLowerCase() + name.slice(1), defaultValue };
        });
        const copyFeedback = new WeakMap();
        let shareURLTimer;
        for (const option of cursorOptions.querySelectorAll("[data-bs-value]")) {
            option.style.cursor = option.dataset.bsValue;
        }
        cursorPicker.addEventListener("shown.bs.combobox", () => {
            cursorOptions.querySelector(".selected").focus();
        });
        cursorPicker.addEventListener("change.bs.combobox", () => {
            HexagonSizeChange();
        });
        document.addEventListener("command", event => {
            if (event.command === "--copy-code") {
                copyText(event.source, event.target.textContent, "Copy failed");
            }
        }, true);
        document.getElementById("copyDesignLink").addEventListener("click", event => {
            copyText(event.currentTarget, syncDesignURL(), "Copy the address bar link", document.getElementById("copyLinkStatus"));
        });
        document.getElementById("resetDesign").addEventListener("click", () => {
            restoreDesign(new URLSearchParams());
            HexagonSizeChange();
            syncDesignURL();
        });
        restoreDesign(new URLSearchParams(location.search));
        HexagonSizeChange();
    </script>
